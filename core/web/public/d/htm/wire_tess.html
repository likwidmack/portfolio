<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tesseract-ish Wireframe + Binary Core (Three.js)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      .hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #cfd6e4;
        font:
          12px/1.35 ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        opacity: 0.8;
        user-select: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.173.0/build/three.module.js",
          "three/addons/": "https://unpkg.com"
        }
      }
    </script>
  </head>
  <body>
    <div class="hint">Drag to rotate • Wheel to zoom</div>

    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.173.0/build/three.module.js';
      import { OrbitControls } from 'https://unpkg.com/three@0.173.0/examples/jsm/controls/OrbitControls.js';

      // ----------------------------
      // Scene / Camera / Renderer
      // ----------------------------
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(6, 4.5, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;

      // Subtle light (not required for lines, but helps the plane if you change materials later)
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));

      // ----------------------------
      // Parameters
      // ----------------------------
      const outerSize = 6.0;
      const innerSize = 3.2;

      const lineMaterial = new THREE.LineBasicMaterial({
        color: 0xe8eefc,
        transparent: true,
        opacity: 0.95,
      });

      // Group everything so you can rotate/scale as a unit
      const group = new THREE.Group();
      scene.add(group);

      // ----------------------------
      // Outer + Inner wireframe cubes
      // ----------------------------
      function addWireCube(size) {
        const geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(size, size, size));
        const lines = new THREE.LineSegments(geo, lineMaterial);
        group.add(lines);
        return lines;
      }

      addWireCube(outerSize);
      addWireCube(innerSize);

      // ----------------------------
      // 8 connector edges (outer vertex -> corresponding inner vertex)
      // ----------------------------
      function cubeVertices(size) {
        const h = size / 2;
        // Order matters; this corresponds to all sign combinations.
        return [
          new THREE.Vector3(-h, -h, -h),
          new THREE.Vector3(+h, -h, -h),
          new THREE.Vector3(-h, +h, -h),
          new THREE.Vector3(+h, +h, -h),
          new THREE.Vector3(-h, -h, +h),
          new THREE.Vector3(+h, -h, +h),
          new THREE.Vector3(-h, +h, +h),
          new THREE.Vector3(+h, +h, +h),
        ];
      }

      const outerVerts = cubeVertices(outerSize);
      const innerVerts = cubeVertices(innerSize);

      const connectorPositions = new Float32Array(8 * 2 * 3); // 8 segments * 2 points * 3 components
      for (let i = 0; i < 8; i++) {
        connectorPositions.set([outerVerts[i].x, outerVerts[i].y, outerVerts[i].z], i * 6 + 0);
        connectorPositions.set([innerVerts[i].x, innerVerts[i].y, innerVerts[i].z], i * 6 + 3);
      }

      const connectorGeo = new THREE.BufferGeometry();
      connectorGeo.setAttribute('position', new THREE.BufferAttribute(connectorPositions, 3));
      const connectors = new THREE.LineSegments(connectorGeo, lineMaterial);
      group.add(connectors);

      // ----------------------------
      // Binary "core" as a texture plane (CanvasTexture)
      // ----------------------------
      function makeBinaryTexture({ text = '0101 1010\n0011 1100\n1110 0001\n1001 0110', size = 512 } = {}) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Background (slightly translucent)
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = 'rgba(10, 14, 20, 0.92)';
        ctx.fillRect(0, 0, size, size);

        // Border
        ctx.strokeStyle = 'rgba(232, 238, 252, 0.35)';
        ctx.lineWidth = Math.max(2, size * 0.006);
        ctx.strokeRect(ctx.lineWidth / 2, ctx.lineWidth / 2, size - ctx.lineWidth, size - ctx.lineWidth);

        // Text
        const fontSize = Math.floor(size * 0.07);
        ctx.font = `${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace`;
        ctx.fillStyle = 'rgba(232, 238, 252, 0.9)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const lines = String(text).split('\n');
        const lineHeight = fontSize * 1.35;
        const totalHeight = lineHeight * (lines.length - 1);
        const centerY = size / 2;

        lines.forEach((line, idx) => {
          const y = centerY - totalHeight / 2 + idx * lineHeight;
          ctx.fillText(line, size / 2, y);
        });

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.needsUpdate = true;
        return tex;
      }

      const binaryTex = makeBinaryTexture();
      const planeSize = 1.55; // tweak for visibility
      const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
      const planeMat = new THREE.MeshBasicMaterial({
        map: binaryTex,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide,
        depthTest: true,
      });
      const binaryPlane = new THREE.Mesh(planeGeo, planeMat);
      binaryPlane.position.set(0, 0, 0);
      group.add(binaryPlane);

      // Optional: a very small inner "core cube" around the plane for emphasis
      const coreCubeSize = 1.2;
      const coreGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(coreCubeSize, coreCubeSize, coreCubeSize));
      const coreLines = new THREE.LineSegments(
        coreGeo,
        new THREE.LineBasicMaterial({
          color: 0xe8eefc,
          transparent: true,
          opacity: 0.35,
        })
      );
      group.add(coreLines);

      // ----------------------------
      // Animate
      // ----------------------------
      function animate() {
        requestAnimationFrame(animate);

        // Slow idle rotation (comment out if you prefer manual only)
        group.rotation.y += 0.002;
        group.rotation.x += 0.001;

        // Keep the binary plane facing the camera (billboard), while the rest rotates
        binaryPlane.quaternion.copy(camera.quaternion);

        controls.update();
        renderer.render(scene, camera);
      }

      animate();

      // ----------------------------
      // Resize
      // ----------------------------
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
