<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tesseract-ish Wireframe + Shaded Planes + Fresnel + Core Glow (Three.js)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07090d;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      .hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #cfd6e4;
        font:
          12px/1.35 ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        opacity: 0.8;
        user-select: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.173.0/build/three.module.js",
          "three/addons/": "https://unpkg.com"
        }
      }
    </script>
  </head>
  <body>
    <div class="hint">Drag to rotate • Wheel to zoom</div>

    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.173.0/build/three.module.js';
      import { OrbitControls } from 'https://unpkg.com/three@0.173.0/examples/jsm/controls/OrbitControls.js';

      // ----------------------------
      // Scene / Camera / Renderer
      // ----------------------------
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x07090d, 10, 28);

      const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(6, 4.5, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;

      // ----------------------------
      // Lights (for shaded planes)
      // ----------------------------
      scene.add(new THREE.AmbientLight(0xffffff, 0.18));

      const keyLight = new THREE.DirectionalLight(0xffffff, 0.95);
      keyLight.position.set(6, 8, 9);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x8aa2ff, 0.55);
      rimLight.position.set(-8, 2, -6);
      scene.add(rimLight);

      const backLight = new THREE.DirectionalLight(0x5167ff, 0.25);
      backLight.position.set(0, -8, 0);
      scene.add(backLight);

      // ----------------------------
      // Group
      // ----------------------------
      const group = new THREE.Group();
      scene.add(group);

      // ----------------------------
      // Parameters
      // ----------------------------
      const outerSize = 6.0;
      const innerSize = 3.0;

      const lineMaterial = new THREE.LineBasicMaterial({
        color: 0xe8eefc,
        transparent: true,
        opacity: 0.95,
      });

      // ----------------------------
      // Helper: Fresnel + gradient shaded cube material
      // - Uses MeshPhysicalMaterial then injects a Fresnel term + vertical gradient tint.
      // ----------------------------
      function makeFresnelGradientMaterial({
        baseColor = 0x9fb3ff,
        opacity = 0.08,
        roughness = 0.28,
        metalness = 0.08,
        transmission = 0.0,
        thickness = 0.0,
        fresnelStrength = 1.0,
        fresnelPower = 3.0,
        gradientStrength = 0.35,
      } = {}) {
        const mat = new THREE.MeshPhysicalMaterial({
          color: baseColor,
          transparent: true,
          opacity,
          roughness,
          metalness,
          transmission,
          thickness,
          side: THREE.DoubleSide,
          depthWrite: false,
        });

        mat.onBeforeCompile = (shader) => {
          shader.uniforms.uFresnelStrength = { value: fresnelStrength };
          shader.uniforms.uFresnelPower = { value: fresnelPower };
          shader.uniforms.uGradientStrength = { value: gradientStrength };
          shader.uniforms.uTime = { value: 0.0 };

          // stash so we can animate
          mat.userData.shader = shader;

          shader.vertexShader = shader.vertexShader
            .replace(
              '#include <common>',
              `#include <common>
               varying vec3 vWorldPos;
               varying vec3 vWorldNormal;`
            )
            .replace(
              '#include <beginnormal_vertex>',
              `#include <beginnormal_vertex>
               vec3 objectNormal = vec3( normal );`
            )
            .replace(
              '#include <defaultnormal_vertex>',
              `#include <defaultnormal_vertex>
               vWorldNormal = normalize( mat3(modelMatrix) * normal );`
            )
            .replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>
               vec4 wp = modelMatrix * vec4(position, 1.0);
               vWorldPos = wp.xyz;`
            );

          shader.fragmentShader = shader.fragmentShader
            .replace(
              '#include <common>',
              `#include <common>
               varying vec3 vWorldPos;
               varying vec3 vWorldNormal;
               uniform float uFresnelStrength;
               uniform float uFresnelPower;
               uniform float uGradientStrength;
               uniform float uTime;`
            )
            .replace(
              '#include <output_fragment>',
              `#include <output_fragment>

               // Fresnel (view-dependent rim)
               vec3 V = normalize(cameraPosition - vWorldPos);
               float fres = pow(1.0 - clamp(dot(normalize(vWorldNormal), V), 0.0, 1.0), uFresnelPower);

               // Vertical gradient tint (world-space Y)
               float g = clamp((vWorldPos.y + 6.0) / 12.0, 0.0, 1.0); // normalize roughly for these sizes
               // Mild "phase shift" shimmer on gradient
               float shimmer = 0.5 + 0.5 * sin(uTime * 1.2 + vWorldPos.x * 0.35 + vWorldPos.z * 0.35);
               g = mix(g, shimmer, 0.18);

               vec3 gradTint = mix(vec3(0.35, 0.45, 1.0), vec3(0.80, 0.88, 1.0), g);
               outgoingLight = mix(outgoingLight, outgoingLight * gradTint, uGradientStrength);

               // Add Fresnel rim into light
               outgoingLight += fres * uFresnelStrength * vec3(0.65, 0.78, 1.0);

               // Slight alpha boost at rim (helps read as "dimensional planes")
               gl_FragColor.a = gl_FragColor.a + fres * 0.12;`
            );
        };

        return mat;
      }

      // ----------------------------
      // Wireframe cubes
      // ----------------------------
      function addWireCube(size) {
        const geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(size, size, size));
        const lines = new THREE.LineSegments(geo, lineMaterial);
        group.add(lines);
        return lines;
      }

      const outerLines = addWireCube(outerSize);
      const innerLines = addWireCube(innerSize);

      // ----------------------------
      // Shaded faces behind wireframes
      // ----------------------------
      function addShadedCube(size, material) {
        const geo = new THREE.BoxGeometry(size, size, size);
        const mesh = new THREE.Mesh(geo, material);
        group.add(mesh);
        return mesh;
      }

      const outerFaceMat = makeFresnelGradientMaterial({
        baseColor: 0x9fb3ff,
        opacity: 0.06,
        roughness: 0.22,
        metalness: 0.05,
        fresnelStrength: 0.75,
        fresnelPower: 2.6,
        gradientStrength: 0.32,
      });

      const innerFaceMat = makeFresnelGradientMaterial({
        baseColor: 0xa9bbff,
        opacity: 0.11,
        roughness: 0.18,
        metalness: 0.06,
        fresnelStrength: 0.95,
        fresnelPower: 2.35,
        gradientStrength: 0.42,
      });

      const outerShaded = addShadedCube(outerSize, outerFaceMat);
      const innerShaded = addShadedCube(innerSize, innerFaceMat);

      // Render-order so edges stay crisp
      outerShaded.renderOrder = 1;
      innerShaded.renderOrder = 1;
      outerLines.renderOrder = 3;
      innerLines.renderOrder = 3;

      // ----------------------------
      // 8 connector edges (outer vertex -> corresponding inner vertex)
      // ----------------------------
      function cubeVertices(size) {
        const h = size / 2;
        return [
          new THREE.Vector3(-h, -h, -h),
          new THREE.Vector3(+h, -h, -h),
          new THREE.Vector3(-h, +h, -h),
          new THREE.Vector3(+h, +h, -h),
          new THREE.Vector3(-h, -h, +h),
          new THREE.Vector3(+h, -h, +h),
          new THREE.Vector3(-h, +h, +h),
          new THREE.Vector3(+h, +h, +h),
        ];
      }

      const outerVerts = cubeVertices(outerSize);
      const innerVerts = cubeVertices(innerSize);

      const connectorPositions = new Float32Array(8 * 2 * 3);
      for (let i = 0; i < 8; i++) {
        connectorPositions.set([outerVerts[i].x, outerVerts[i].y, outerVerts[i].z], i * 6 + 0);
        connectorPositions.set([innerVerts[i].x, innerVerts[i].y, innerVerts[i].z], i * 6 + 3);
      }

      const connectorGeo = new THREE.BufferGeometry();
      connectorGeo.setAttribute('position', new THREE.BufferAttribute(connectorPositions, 3));
      const connectors = new THREE.LineSegments(connectorGeo, lineMaterial);
      connectors.renderOrder = 3;
      group.add(connectors);

      // ----------------------------
      // Binary "core" as a texture plane (CanvasTexture)
      // ----------------------------
      function makeBinaryTexture({ text = '0101 1010\n0011 1100\n1110 0001\n1001 0110', size = 512 } = {}) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // background
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = 'rgba(8, 10, 16, 0.96)';
        ctx.fillRect(0, 0, size, size);

        // soft inner glow
        const grd = ctx.createRadialGradient(size / 2, size / 2, size * 0.05, size / 2, size / 2, size * 0.55);
        grd.addColorStop(0, 'rgba(120, 150, 255, 0.22)');
        grd.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, size, size);

        // border
        ctx.strokeStyle = 'rgba(232, 238, 252, 0.35)';
        ctx.lineWidth = Math.max(2, size * 0.006);
        ctx.strokeRect(ctx.lineWidth / 2, ctx.lineWidth / 2, size - ctx.lineWidth, size - ctx.lineWidth);

        // text
        const fontSize = Math.floor(size * 0.072);
        ctx.font = `${fontSize}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace`;
        ctx.fillStyle = 'rgba(232, 238, 252, 0.92)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const lines = String(text).split('\n');
        const lineHeight = fontSize * 1.35;
        const totalHeight = lineHeight * (lines.length - 1);
        const centerY = size / 2;

        lines.forEach((line, idx) => {
          const y = centerY - totalHeight / 2 + idx * lineHeight;
          ctx.fillText(line, size / 2, y);
        });

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.needsUpdate = true;
        return tex;
      }

      const binaryTex = makeBinaryTexture();

      const planeSize = 1.55;
      const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
      const planeMat = new THREE.MeshBasicMaterial({
        map: binaryTex,
        transparent: true,
        opacity: 0.92,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending, // makes it feel "energized"
        depthWrite: false,
      });
      const binaryPlane = new THREE.Mesh(planeGeo, planeMat);
      binaryPlane.position.set(0, 0, 0);
      binaryPlane.renderOrder = 6;
      group.add(binaryPlane);

      // Small core cube around the plane
      const coreCubeSize = 1.2;
      const coreGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(coreCubeSize, coreCubeSize, coreCubeSize));
      const coreLines = new THREE.LineSegments(
        coreGeo,
        new THREE.LineBasicMaterial({ color: 0xe8eefc, transparent: true, opacity: 0.3 })
      );
      coreLines.renderOrder = 5;
      group.add(coreLines);

      // ----------------------------
      // Faux volumetric glow: additive spheres (cheap + effective)
      // ----------------------------
      function addGlowSphere(radius, opacity) {
        const geo = new THREE.SphereGeometry(radius, 32, 32);
        const mat = new THREE.MeshBasicMaterial({
          color: 0x7e9bff,
          transparent: true,
          opacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.renderOrder = 4;
        group.add(mesh);
        return mesh;
      }

      const glow1 = addGlowSphere(0.95, 0.1);
      const glow2 = addGlowSphere(1.55, 0.05);
      const glow3 = addGlowSphere(2.35, 0.02);

      // ----------------------------
      // "Dimensional phase shift": subtle inner cube oscillation + material shimmer
      // (keeps topology intact; just animates scale/rotation a bit)
      // ----------------------------
      const innerPhase = {
        baseScale: 1.0,
        scaleAmp: 0.035,
        rotAmp: 0.1,
      };

      // ----------------------------
      // Animate
      // ----------------------------
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const t = clock.getElapsedTime();

        // Slow idle rotation for the whole structure
        group.rotation.y += 0.002;
        group.rotation.x += 0.001;

        // Keep binary plane facing camera (billboard)
        binaryPlane.quaternion.copy(camera.quaternion);

        // Phase-shift the inner cube slightly (faces + edges + connectors remain correct)
        const s = innerPhase.baseScale + Math.sin(t * 1.3) * innerPhase.scaleAmp;
        innerShaded.scale.setScalar(s);
        innerLines.scale.setScalar(s);

        innerShaded.rotation.y = Math.sin(t * 0.9) * innerPhase.rotAmp;
        innerLines.rotation.y = innerShaded.rotation.y;

        // Material shimmer uniforms (gradient/fresnel shader)
        if (outerFaceMat.userData.shader) outerFaceMat.userData.shader.uniforms.uTime.value = t;
        if (innerFaceMat.userData.shader) innerFaceMat.userData.shader.uniforms.uTime.value = t * 1.15;

        // Pulse core glow slightly
        const p = 0.5 + 0.5 * Math.sin(t * 2.1);
        glow1.material.opacity = 0.08 + p * 0.05;
        glow2.material.opacity = 0.035 + p * 0.03;
        glow3.material.opacity = 0.015 + p * 0.015;

        controls.update();
        renderer.render(scene, camera);
      }

      animate();

      // ----------------------------
      // Resize
      // ----------------------------
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
