<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Data visualization pipeline</title>
  <desc id="desc">Ingested election and product data move through aggregation, visual encoding, and accessible presentation with clear recovery when feeds stall.</desc>
  <rect width="1440" height="810" fill="#171513"/>
  <g fill="#f7f1e7" font-family="Arial, sans-serif">
    <text x="90" y="90" font-size="36" font-weight="700">Make changing numbers readable under pressure</text>
    <text x="90" y="135" font-size="22" fill="#cbbbaa">Maps, polls, and system diagrams stay truthful when feeds lag or partial results arrive.</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="80" y="300" width="220" height="180" rx="24" fill="#27231f" stroke="#6e6259" stroke-width="3"/>
      <text x="190" y="375" fill="#ff766a" font-size="24" font-weight="700">Ingest</text>
      <text x="190" y="415" fill="#f7f1e7" font-size="18">feeds &#183; events</text>
    </g>
    <g>
      <rect x="380" y="260" width="260" height="260" rx="30" fill="#fffaf1"/>
      <text x="510" y="355" fill="#171513" font-size="24" font-weight="700">Encode</text>
      <text x="510" y="400" fill="#5d5149" font-size="18">geo &#183; scales</text>
      <text x="510" y="433" fill="#5d5149" font-size="18">hierarchies</text>
    </g>
    <g>
      <rect x="720" y="300" width="260" height="180" rx="24" fill="#27231f" stroke="#6e6259" stroke-width="3"/>
      <text x="850" y="375" fill="#ff766a" font-size="24" font-weight="700">Present</text>
      <text x="850" y="415" fill="#f7f1e7" font-size="18">map &#183; chart &#183; graph</text>
    </g>
    <g>
      <rect x="1060" y="300" width="280" height="180" rx="24" fill="#ff766a"/>
      <text x="1200" y="375" fill="#171513" font-size="24" font-weight="700">Accessible read</text>
      <text x="1200" y="415" fill="#171513" font-size="18">labels &#183; states</text>
    </g>
  </g>
  <g fill="none" stroke="#ff766a" stroke-width="5">
    <path d="M300 390H380"/>
    <path d="M640 390H720"/>
    <path d="M980 390H1060"/>
  </g>
</svg>
