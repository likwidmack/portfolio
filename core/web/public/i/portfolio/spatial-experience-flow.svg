<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Spatial experience stack</title>
  <desc id="desc">Concept, device capability, real-time scene, and interface controls form a loop for marker-based AR, WebXR, and WebGL prototypes.</desc>
  <rect width="1440" height="810" fill="#171513"/>
  <g fill="#f7f1e7" font-family="Arial, sans-serif">
    <text x="90" y="90" font-size="36" font-weight="700">Spatial fidelity without a dead-end demo</text>
    <text x="90" y="135" font-size="22" fill="#cbbbaa">Capability detection, scene state, and recovery keep AR and WebGL experiences usable.</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="70" y="280" width="220" height="200" rx="24" fill="#27231f" stroke="#6e6259" stroke-width="3"/>
      <text x="180" y="355" fill="#ff766a" font-size="24" font-weight="700">Concept</text>
      <text x="180" y="395" fill="#f7f1e7" font-size="18">event &#183; product</text>
      <text x="180" y="425" fill="#f7f1e7" font-size="18">storyboard</text>
    </g>
    <g>
      <rect x="370" y="240" width="260" height="280" rx="30" fill="#fffaf1"/>
      <text x="500" y="340" fill="#171513" font-size="24" font-weight="700">Capability gate</text>
      <text x="500" y="385" fill="#5d5149" font-size="18">WebXR &#183; camera</text>
      <text x="500" y="418" fill="#5d5149" font-size="18">GLTF &#183; fallback UI</text>
    </g>
    <g>
      <rect x="710" y="280" width="260" height="200" rx="24" fill="#27231f" stroke="#6e6259" stroke-width="3"/>
      <text x="840" y="355" fill="#ff766a" font-size="24" font-weight="700">Real-time scene</text>
      <text x="840" y="395" fill="#f7f1e7" font-size="18">Three &#183; Babylon</text>
      <text x="840" y="425" fill="#f7f1e7" font-size="18">marker / model</text>
    </g>
    <g>
      <rect x="1050" y="280" width="280" height="200" rx="24" fill="#ff766a"/>
      <text x="1190" y="355" fill="#171513" font-size="24" font-weight="700">Interface loop</text>
      <text x="1190" y="395" fill="#171513" font-size="18">hints &#183; QR &#183; retry</text>
      <text x="1190" y="425" fill="#171513" font-size="18">Quick Look path</text>
    </g>
  </g>
  <g fill="none" stroke="#ff766a" stroke-width="5">
    <path d="M290 380H370"/>
    <path d="M630 380H710"/>
    <path d="M970 380H1050"/>
  </g>
</svg>
