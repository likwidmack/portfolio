name: GitHub profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - sync/update-github-profile.mjs
      - .github/workflows/github-profile.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Update About, homepage, and topics
        env:
          LK_GH_TOKEN: ${{ secrets.LK_GH_TOKEN }}
        run: |
          if [ -z "${LK_GH_TOKEN}" ]; then
            echo "LK_GH_TOKEN is not set in Actions secrets; skip"
            exit 0
          fi
          node sync/update-github-profile.mjs
