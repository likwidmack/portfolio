name: Sync public snapshot

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Source tag (vX.Y.Z) or development. Empty = next new public semver tag."
        required: false
        type: string

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      branch: ${{ steps.meta.outputs.branch }}
      skipped: ${{ steps.meta.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Sync from tamaramack/tamaramack.github.io
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          chmod +x sync/sync.sh
          if [ -n "${SOURCE_REF}" ]; then
            bash sync/sync.sh --tag "${SOURCE_REF}"
          else
            bash sync/sync.sh
          fi
      - id: meta
        run: |
          python3 - <<'PY'
          import json, os
          skipped = "false"
          try:
              meta = json.load(open(".sync-meta.json"))
          except FileNotFoundError:
              skipped = "true"
              meta = {"sourceTag": "none", "sourceSha": "unknown"}
          tag = meta.get("sourceTag") or "head"
          sha = meta.get("sourceSha") or "unknown"
          branch = f"sync/{tag}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"tag={tag}\nsha={sha}\nbranch={branch}\nskipped={skipped}\n")
          PY
      - name: Open sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ steps.meta.outputs.branch }}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "sync: tamaramack/tamaramack.github.io ${{ steps.meta.outputs.tag }} (${{ steps.meta.outputs.sha }})"
          git push -u origin "${{ steps.meta.outputs.branch }}"
          gh pr create --fill --base main --head "${{ steps.meta.outputs.branch }}" || true

  review:
    needs: sanitize
    if: needs.sanitize.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Cursor review
        working-directory: .github/scripts
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SOURCE_TAG: ${{ needs.sanitize.outputs.tag }}
          DEST_BRANCH: ${{ needs.sanitize.outputs.branch }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY missing; skip review"
            exit 0
          fi
          npm install
          node review.mjs
