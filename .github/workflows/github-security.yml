name: GitHub security settings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sync/apply-github-security.mjs
      - .github/workflows/github-security.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable private reporting, Dependabot, and main protection
        env:
          LK_GH_TOKEN: ${{ secrets.LK_GH_TOKEN }}
        run: |
          if [ -z "${LK_GH_TOKEN}" ]; then
            echo "LK_GH_TOKEN is not set in Actions secrets; skip"
            exit 0
          fi
          node sync/apply-github-security.mjs
