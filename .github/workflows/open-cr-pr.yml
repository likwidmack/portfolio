name: Open Cursor branch PR

# Dest-owned: open a squash PR for Cursor `cr/**` branches.
on:
  push:
    branches:
      - "cr/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create pull request if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$REPO" --head "$HEAD_REF" --base main --state open --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            gh pr list --repo "$REPO" --head "$HEAD_REF" --base main --state open --json url --jq '.[0].url'
            exit 0
          fi
          title="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
          {
            printf '%s\n\n' "$COMMIT_MESSAGE"
            printf '%s\n' "Squash-merge into \`main\`. Do not rebase or force-push \`main\`."
          } > "${RUNNER_TEMP}/pr-body.md"
          set +e
          gh pr create --repo "$REPO" --base main --head "$HEAD_REF" --title "$title" --body-file "${RUNNER_TEMP}/pr-body.md" >"${RUNNER_TEMP}/pr.out" 2>"${RUNNER_TEMP}/pr.err"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat "${RUNNER_TEMP}/pr.out"
            exit 0
          fi
          err="$(tr '\n' ' ' < "${RUNNER_TEMP}/pr.err")"
          echo "::error::gh pr create failed: ${err}"
          cat "${RUNNER_TEMP}/pr.out" || true
          cat "${RUNNER_TEMP}/pr.err" || true
          exit "$status"
